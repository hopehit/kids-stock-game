<title>小小投资家 · 经营闯关版</title>
<style>
:root{--bg:#FFF7E6;--card:#fff;--ink:#2B2D42;--ink2:#5C6070;--ink3:#8A8FA0;--line:#E8DCC6;--accent:#2F80ED;--accentSoft:#E3EEFF;--up:#E5383B;--down:#2A9D55;--okSoft:#E3F6EA;--badSoft:#FDE4E4;--warnSoft:#FFF1D6;--warn:#B26A00;--gold:#F2A900;--tea:#FFB74D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:19px;line-height:1.6;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-wrap:anywhere;word-break:break-word}
.wrap{max-width:1200px;margin:0 auto;padding:12px 20px 40px}
h1{font-size:30px;line-height:1.25;margin:8px 0 6px}
h2{font-size:24px;line-height:1.3;margin:24px 0 12px}
h3{font-size:20px;line-height:1.4;margin:0 0 6px}
p{margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;align-items:stretch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
button{font-family:inherit;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:48px;min-width:48px;cursor:pointer;font-size:18px}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left}
button.card{display:block;width:100%}
.card.on{border-color:var(--accent);background:var(--accentSoft)}
.card.lock{background:#F6F0E4}
.btn{padding:10px 22px;font-size:19px;font-weight:600;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2a00}
.btn.red{border-color:#F1B5B5;color:var(--up)}
.chip{padding:8px 18px;font-size:18px;font-weight:600;border-radius:999px;border:2px solid var(--line);background:var(--card)}
.chip.on{border-color:var(--accent);background:var(--accentSoft)}
@media (hover:hover){.btn:not(:disabled):hover,.chip:not(:disabled):hover,button.card:not(:disabled):hover,.opt:not(:disabled):hover,.nav button:hover{border-color:var(--accent);filter:brightness(1.03);box-shadow:0 2px 8px rgba(47,128,237,.15)}.btn.pri:not(:disabled):hover{filter:brightness(1.08)}}
.muted{color:var(--ink2)}.small{font-size:16px}.tiny{font-size:15px;color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}.ok{color:var(--down)}.no{color:var(--up)}
.top{position:sticky;top:0;z-index:5;background:rgba(255,247,230,.96);padding:8px 0 6px;border-bottom:2px solid var(--line);margin-bottom:6px}
.top .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700;font-size:18px;min-height:44px}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.nav button{border:2px solid var(--line);background:#fff;border-radius:14px;font-weight:600;font-size:17px;padding:4px 6px;line-height:1.25}
.nav button.on{border-color:var(--accent);background:var(--accentSoft)}
.nav .i{font-size:22px;display:block}
.tag{display:inline-block;background:#FFE9E9;color:#B42318;border:1px solid #F5C2C2;border-radius:8px;padding:0 8px;font-size:14px;font-weight:700;white-space:nowrap;vertical-align:middle}
.disc{margin-top:28px;padding:12px 16px;border-radius:14px;background:#fff;border:2px dashed var(--line);font-size:15px;color:var(--ink2)}
.warn{background:var(--warnSoft);border:2px solid #F3D9A4;border-radius:16px;padding:12px 16px;font-size:18px}.warn b{color:var(--warn)}
.tip{margin-top:12px;padding:12px 16px;border-radius:14px;background:#FFF3C4;font-size:18px}
.good{padding:12px 16px;border-radius:14px;background:var(--okSoft);border:2px solid #BDE5CB}
.bad{padding:12px 16px;border-radius:14px;background:var(--badSoft);border:2px solid #F1B5B5}
.eq{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:12px;text-align:center;font-size:20px;margin:12px 0}
.tile{flex:1 1 150px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.tile .l{font-size:15px;color:var(--ink3)}.tile .v{font-size:24px;font-weight:700;margin-top:2px}
.bar{height:14px;border-radius:999px;background:#F0E6D2;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.lesson{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.lesson .ico{font-size:64px;text-align:center;line-height:80px}
.pt{display:flex;gap:12px;padding:8px 0;border-top:1px solid #F1E8D8;font-size:19px;line-height:30px}.pt:first-of-type{border-top:none}
.pt b{flex:0 0 30px;height:30px;line-height:30px;border-radius:15px;background:var(--accentSoft);color:var(--accent);text-align:center;font-size:15px}
.q{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0}
.opt{flex:1 1 220px;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:#FFFDF8;font-size:19px;text-align:left}
.opt:disabled{opacity:.8}.opt.right:disabled,.opt.wrong:disabled{opacity:1}
.opt.right{border-color:var(--down);background:var(--okSoft)}.opt.wrong{border-color:var(--up);background:var(--badSoft)}.opt.sel{border-color:var(--accent);background:var(--accentSoft)}
.exp{margin-top:10px;font-size:18px;line-height:28px;color:var(--ink2)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:2px solid var(--line);border-radius:18px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:10px 12px;border-bottom:1px solid #F1E8D8;text-align:right;white-space:nowrap}th{font-size:15px;color:var(--ink3);font-weight:600}
th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:none}
.words td{white-space:normal;text-align:left}.words td:last-child{white-space:nowrap}
.stepper{flex:1 1 260px;min-width:0}.stepper .lab{font-size:16px;color:var(--ink2);margin-bottom:6px}
.stepper .in{display:flex;gap:8px}.stepper button{width:56px;flex:0 0 56px;font-size:28px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.stepper input{flex:1;min-width:0;min-height:48px;font-size:22px;text-align:center;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
.txt{width:100%;min-height:52px;font-size:22px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);font-family:inherit;background:#fff;color:var(--ink)}
.chart{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}
.chart svg{display:block;width:100%;height:auto;max-height:420px}
ol.list{padding-left:28px;margin:8px 0}ol.list li{margin:6px 0}
.steps .s{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}.steps .s b{display:block}
.msg{font-size:19px;font-weight:600;padding:10px 14px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.news{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0;opacity:.75}.news.first{opacity:1;border-color:var(--accent);background:var(--accentSoft)}
.cups{display:flex;flex-wrap:wrap;gap:6px;font-size:36px;line-height:44px}.cups span{opacity:.3}.cups span.on{opacity:1}
.vs{display:flex;gap:12px;flex-wrap:wrap}.vs>div{flex:1 1 220px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:28px;line-height:40px}
.chat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:6px 0;display:inline-block}
.lvcard{display:flex !important;gap:12px;align-items:center}
.lvcard .ic{font-size:40px;line-height:48px;flex:0 0 52px;text-align:center}
.lvcard .tx{flex:1;min-width:0}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badges span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:16px}
.two{display:block}
.big{font-size:56px;line-height:64px}
.av{font-size:34px}
.hide{display:none}
@media (min-width:1000px){.two{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;align-items:start}.two>.side{position:sticky;top:150px}}
@media (max-width:700px){body{font-size:17px}.wrap{padding:8px 12px 32px}h1{font-size:25px}h2{font-size:21px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:15px}.grid{grid-template-columns:1fr}.opt{flex:1 1 100%;font-size:17px}.tile .v{font-size:20px}table{font-size:16px}th,td{padding:8px}.stepper{flex:1 1 100%}.pt{font-size:17px;line-height:27px}.big{font-size:44px;line-height:52px}}
.mascot{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.mface{font-size:40px;line-height:48px;flex:0 0 48px;text-align:center;animation:bob 2.4s ease-in-out infinite}
.mbub{position:relative;flex:1;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-size:17px}.mbub:before{content:"";position:absolute;left:-9px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.pill.sm{min-height:0;padding:0 10px;font-size:15px}button.pill{cursor:pointer}
.scene{position:relative;height:150px;border-radius:18px;overflow:hidden;background:linear-gradient(#CDEBFF,#FFF7E6 70%);border:2px solid var(--line);margin:8px 0}
.scene.rain{background:linear-gradient(#B8C4D6,#EEF1F6 70%)}.scene.hot{background:linear-gradient(#FFE2A8,#FFF7E6 70%)}
.scene .sky{position:absolute;right:14px;top:6px;font-size:34px}
.scene .front{position:absolute;left:12px;bottom:10px;width:min(52%,300px);height:110px;background:#fff;border:2px solid #E8CFA6;border-radius:12px;text-align:center}
.scene .awn{height:22px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,#FFB74D 0 18px,#fff 18px 36px)}.scene .lv2 .awn,.scene .lv3 .awn{background:repeating-linear-gradient(90deg,#FF7A59 0 18px,#FFE08A 18px 36px)}.scene .lv3{box-shadow:0 0 0 3px #F2A900}
.scene .sgn{font-weight:700;font-size:15px;line-height:1.3;padding:4px 6px}.scene .ctr{font-size:26px}
.scene .queue{position:absolute;left:56%;right:8px;bottom:8px;display:flex;flex-wrap:wrap-reverse;gap:2px;font-size:26px;line-height:30px}
.scene.go .queue span{display:inline-block;animation:walk .6s ease-out both}
.scene .coin{position:absolute;bottom:40px;font-style:normal;font-size:24px;opacity:0;animation:fly 1.4s ease-out forwards}
@keyframes walk{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}@keyframes fly{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px)}}@keyframes bob{50%{transform:translateY(-4px)}}
.mini{margin:12px 0;border-color:#F3D9A4;background:#FFFCF3}.order{display:flex;gap:10px;align-items:center;margin:8px 0}.order .cust{font-size:40px}.order .bub{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.evc{border-color:#BFD5F7;background:#F7FAFF}.evt{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:18px}.evi{font-size:40px;line-height:48px}.tag2{display:inline-block;background:var(--accentSoft);color:var(--accent);border-radius:8px;padding:0 8px;font-size:14px;font-weight:700}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.ach{background:#F6F0E4;border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;color:var(--ink3)}.ach.on{background:#fff;border:2px solid #F3D9A4;color:var(--ink)}.ach .ai{font-size:36px;line-height:44px}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}.toast{background:#2B2D42;color:#fff;padding:10px 18px;border-radius:14px;font-size:17px;max-width:92vw;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:tin .25s ease-out}.toast .tiny{color:#D9DCE6}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
textarea.code{min-height:96px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;margin-top:8px}
.newscard{background:#fff;border:2px solid #F5C2C2;border-radius:16px;margin:10px 0;overflow:hidden}.newscard .nhd{background:#FFE9E9;color:#B42318;font-weight:700;padding:4px 14px;font-size:16px}.newscard .nbd{padding:10px 14px;font-size:19px}
.stocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}.stk{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}.stk .sn{font-weight:700}.stk .sp{font-size:28px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}.stk .sp.tick{transform:scale(1.06)}.stk .btn{padding:6px 12px;font-size:16px;flex:1}
.recap{margin:10px 0;border-color:#BFD5F7}.reveal{font-size:22px;font-weight:700;margin:10px 0}.reveal .arrow{display:inline-block;font-size:34px}.reveal .arrow.pop{animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
svg.candle{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}.kbuild{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.kprev{flex:1 1 220px;max-width:300px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px}
.kst{display:flex;align-items:center;gap:8px;margin:6px 0}.kst span{width:48px;color:var(--ink2)}.kst b{min-width:40px;text-align:center;font-size:22px}.kst button{width:52px;font-size:26px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:#fff}
.fins{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:10px 0}.fin b{display:block;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none !important;transition:none !important}.scene .coin{display:none}}
#lesson{scroll-margin-top:170px}
@media (max-width:700px){.top{position:static}#lesson{scroll-margin-top:10px}}
@media (max-height:500px){.top{position:static}.two>.side{position:static}}
@media (max-height:500px) and (min-width:700px){.nav{grid-template-columns:repeat(6,1fr)}}
</style>

<script>
"use strict";
var D={"GRADES":[{"id":"g4","name":"四年级","icon":"🐣","desc":"从奶茶店认识股票"},{"id":"g5","name":"五年级","icon":"🐥","desc":"学会算涨跌和复利"},{"id":"g8","name":"初二","icon":"🦅","desc":"看懂公司和 K 线"}],"LESSONS":{"g4":[{"id":"g4-1","icon":"🧋","title":"公司和股份是什么","tip":"股票 = 公司的一小块。","pts":["小美想开一家「快乐奶茶店」，可是她一个人的钱不够。","她把奶茶店分成 100 份，请朋友们一起出钱。","每一份，就叫一「股」。","你买了 1 份，就是这家店的小小主人，叫「股东」。","店赚钱了，股东一起分钱。店亏钱了，大家一起亏。","大公司也一样，只是分成的份数特别特别多。"],"qs":[{"q":"买了一家公司的股票，你就成了这家公司的？","o":["员工","股东，小小主人之一","顾客"],"a":1,"e":"买股票就是买下公司的一小块，所以你是股东。"},{"q":"奶茶店分成 100 份，你买了 10 份，你占这家店多少？","o":["百分之一","十分之一","一半"],"a":1,"e":"10 ÷ 100 = 十分之一。"}]},{"id":"g4-2","icon":"🎢","title":"股票为什么会涨跌","tip":"想买的人多就涨，想卖的人多就跌。","pts":["股票的价格不是固定的，每天都在变。","想买的人多，想卖的人少，价格就往上走。","想卖的人多，想买的人少，价格就往下走。","就像限量玩具：大家都抢，价格就涨；没人要，只好便宜卖。","好消息常让人想买，坏消息常让人想卖。","但好消息不一定就涨，市场有时候猜不透。"],"qs":[{"q":"很多人抢着买，很少人愿意卖，价格通常会？","o":["涨","跌","不变"],"a":0,"e":"买的人多、卖的人少，价格就容易上涨。"},{"q":"快乐奶茶的新口味特别受欢迎，这算？","o":["好消息","坏消息","和公司没关系"],"a":0,"e":"卖得好是好消息。不过价格涨不涨，还要看大家怎么想。"}]},{"id":"g4-3","icon":"🏦","title":"存银行和买股票","tip":"要用的钱放银行，闲钱才考虑投资。","pts":["钱存银行：利息事先说好，比较稳。","买股票：可能赚得多，也可能亏，甚至亏很多。","银行像慢慢爬的小乌龟，稳稳的。","股票像坐过山车，有上有下。","马上要用的钱，比如学费，不能拿去买股票。"],"qs":[{"q":"下个月要交的学费，放哪里更合适？","o":["存在银行","买股票","借给不认识的人"],"a":0,"e":"马上要用的钱要放在稳的地方。"},{"q":"下面哪句话是对的？","o":["买股票一定赚钱","买股票有可能亏钱","存银行一定会亏一半"],"a":1,"e":"股票会涨也会跌，有可能亏钱。"}]},{"id":"g4-4","icon":"🧺","title":"风险和鸡蛋篮子","tip":"不要把所有鸡蛋放在一个篮子里。","pts":["风险，就是结果可能和你想的不一样。","所有鸡蛋放一个篮子，篮子一摔，鸡蛋全碎。","把钱分开放，一个出问题，别的还在。","只买一家公司的股票，风险最大。"],"qs":[{"q":"小明把所有零花钱都买了一家公司的股票，这样？","o":["很安全","风险很大","一定赚钱"],"a":1,"e":"全部放在一家公司，它出问题就全受影响。"},{"q":"「不要把鸡蛋放在一个篮子里」是什么意思？","o":["鸡蛋要快点吃","要分散，别全押在一处","篮子要买大的"],"a":1,"e":"意思是分散风险。"}]},{"id":"g4-5","icon":"⚠️","title":"借钱和赌博很危险","tip":"不借钱，不赌博，不懂的不碰。","pts":["借钱买股票，亏了钱，借的钱还要还，还要加利息。","有时候亏的比自己有的还多，非常危险。","赌博靠运气，时间长了，大多数人都会输钱。","买股票是当公司的主人，要认真学习。","把股票当赌博，就很容易输。"],"qs":[{"q":"借钱买股票，亏了以后会怎样？","o":["借的钱不用还了","借的钱和利息都要还","银行帮你还"],"a":1,"e":"亏了钱，债还在，利息也要付。"},{"q":"下面哪个是好习惯？","o":["借钱买股票","听说要涨就全买","先学习，不懂的不碰"],"a":2,"e":"先弄懂再行动，是最重要的习惯。"}]}],"g5":[{"id":"g5-1","icon":"👨‍👩‍👧","title":"开户和交易谁来做","tip":"真实的买卖，必须由爸爸妈妈操作和决定。","pts":["买卖股票，要先在证券公司开一个「证券账户」。","开户一般要年满 18 岁，用本人身份证。","小学生不能自己开户，也不能用别人的账户。","所以真实的买卖，必须由大人来操作和决定。","下单时要写清楚：买哪只、买多少、什么价格。","这个平台用的是虚拟钱，是练习，不是真的。"],"qs":[{"q":"小学生想买真实的股票，应该？","o":["自己偷偷开户","和爸妈商量，由大人操作","借同学的账户"],"a":1,"e":"未成年人不能自己开户，真实交易由家长决定。"},{"q":"这个平台的模拟交易，用的是？","o":["真钱","虚拟钱"],"a":1,"e":"模拟游戏里的 10000 元是假的，放心练习。"}]},{"id":"g5-2","icon":"🔢","title":"价格和涨跌幅","extra":"pct","tip":"涨跌幅看的是变化占昨天价格的多少。","pts":["股价，就是买 1 股要花的钱。","涨跌额 = 今天价格 − 昨天价格。","例子：绿叶书店昨天 10 元，今天 11 元。","涨了 1 元，1 ÷ 10 = 10%，涨幅是 10%。","在 A 股，红色通常表示涨，绿色表示跌。","美股的习惯正好反过来，绿涨红跌。"],"qs":[{"q":"昨天 20 元，今天 22 元，涨幅是多少？","o":["2%","10%","20%"],"a":1,"e":"涨了 2 元，2 ÷ 20 = 10%。"},{"q":"昨天 10 元，今天 9 元，是？","o":["涨 10%","跌 10%","跌 1%"],"a":1,"e":"跌了 1 元，1 ÷ 10 = 10%，是下跌。"}]},{"id":"g5-3","icon":"➗","title":"百分比计算","tip":"跌 50%，要涨 100% 才能回本。","pts":["百分比，就是每 100 份里有几份。","100 元涨 10%，变成 110 元。","110 元再跌 10%，变成 99 元，回不到 100 了！","因为第二次是用 110 元来算的。","100 元跌 50% 变 50 元，要翻一倍才能回到 100。","所以大跌很可怕，保护本金很重要。"],"qs":[{"q":"100 元先涨 10%，再跌 10%，最后是？","o":["100 元","99 元","101 元"],"a":1,"e":"100 → 110 → 110 × 0.9 = 99。"},{"q":"从 100 元跌到 50 元，要涨多少才能回到 100 元？","o":["50%","100%","200%"],"a":1,"e":"50 元要涨 50 元，50 ÷ 50 = 100%。"}]},{"id":"g5-4","icon":"🎁","title":"分红","tip":"分红是公司把赚的钱分给股东。","pts":["公司赚了钱，可以拿一部分分给股东，这叫「分红」。","比如每股分 0.5 元，你有 100 股，就分到 50 元。","不是每家公司都分红。","分多少也会变，今年和明年可能不一样。","有的公司把钱留下来开新店、做研发，帮公司长大。"],"qs":[{"q":"每股分红 0.3 元，你有 200 股，能分到？","o":["6 元","60 元","600 元"],"a":1,"e":"0.3 × 200 = 60 元。"},{"q":"关于分红，哪句对？","o":["所有公司每年都分红","分红多少可能会变","分红是银行发的"],"a":1,"e":"分不分、分多少，由公司根据经营情况决定。"}]},{"id":"g5-5","icon":"📊","title":"指数和基金","tip":"指数基金买的是一整篮子股票。","pts":["指数像「全班平均分」，看一篮子股票整体好不好。","比如沪深 300 指数，就是由 300 只大公司股票组成的一篮子。","基金是很多人把钱交给专业的人，一起买很多股票或债券。","指数基金照着指数买一篮子股票，自动就分散了。","基金也会亏钱，它不是存款。"],"qs":[{"q":"指数最像什么？","o":["一个同学的分数","全班平均分","考试的时间"],"a":1,"e":"指数反映的是一篮子股票的整体表现。"},{"q":"基金和存款有什么不同？","o":["基金也可能亏钱","基金一定赚钱","完全一样"],"a":0,"e":"基金买的是股票、债券等，价格会波动。"}]},{"id":"g5-6","icon":"⛄","title":"长期投资和复利","extra":"calc","tip":"时间是复利最好的朋友。","pts":["复利就是「利滚利」：赚到的钱，也继续帮你赚钱。","像滚雪球，越滚越大，时间越长越明显。","真实投资每年的收益不固定，有时还会亏。","下面的计算器只是假设每年收益一样。","早开始、有耐心、不乱动，是复利的好朋友。"],"qs":[{"q":"1000 元，每年 5% 复利，2 年后是？","o":["1100 元","1102.5 元","1050 元"],"a":1,"e":"1000 × 1.05 × 1.05 = 1102.5 元。"},{"q":"复利最需要什么？","o":["时间和耐心","每天买卖","借钱"],"a":0,"e":"复利要靠时间慢慢滚大。"}]}],"g8":[{"id":"g8-1","icon":"🏢","title":"市值","tip":"比公司大小看市值，不看股价。","pts":["市值 = 股价 × 总股数，是市场给整家公司标的价。","例子：虚构的快乐奶茶股价 20 元，共 1 亿股，市值 20 亿元。","股价高不代表公司大，要乘上股数。","市值每天随股价变化。"],"qs":[{"q":"A 股价 100 元、1000 万股；B 股价 10 元、5 亿股。谁的市值大？","o":["A","B","一样大"],"a":1,"e":"A 是 10 亿，B 是 50 亿，B 更大。"},{"q":"市值怎么算？","o":["股价 × 总股数","股价 × 利润","营收 − 成本"],"a":0,"e":"市值 = 股价 × 总股数。"}]},{"id":"g8-2","icon":"💰","title":"营收和利润","tip":"营收是收进来的钱，利润是最后剩下的钱。","pts":["营收：公司卖东西、提供服务收到的钱。","利润：营收减去成本、费用和税以后剩下的。","例子：奶茶店一年卖了 100 万，原料、房租、工资花了 90 万，不算税，利润 10 万。","营收很高不等于赚钱，成本可能更高。","看一家公司，要看好几年的变化，不只看一年。"],"qs":[{"q":"营收 100 万，成本和费用 90 万，不考虑税，利润是？","o":["10 万","90 万","190 万"],"a":0,"e":"100 − 90 = 10 万。"},{"q":"营收很高的公司一定赚钱吗？","o":["一定","不一定，成本可能更高"],"a":1,"e":"利润才是剩下的钱。"}]},{"id":"g8-3","icon":"🔍","title":"市盈率入门","extra":"pe","tip":"市盈率只是一个参考，不能单独决定好坏。","pts":["市盈率（PE）= 股价 ÷ 每股收益，也等于市值 ÷ 净利润。","粗略理解：按现在的利润，多少年能赚回现在的市值。","例子：虚构的小火箭市值 50 亿，净利润 2.5 亿，PE 是 20。","PE 高，可能是大家看好未来，也可能是太贵。","PE 低，可能便宜，也可能公司有麻烦。","不同行业不能直接比。公司亏损时，PE 没有意义。"],"qs":[{"q":"市值 30 亿，净利润 3 亿，市盈率是？","o":["10","30","90"],"a":0,"e":"30 ÷ 3 = 10。"},{"q":"市盈率低，就一定值得买吗？","o":["是","不一定，要结合公司情况"],"a":1,"e":"低 PE 可能是公司前景变差了。"}]},{"id":"g8-4","icon":"🕯️","title":"K 线图怎么看","extra":"kline","tip":"K 线记录的是过去，不能保证预测未来。","pts":["一根 K 线，记录一段时间（比如一天）的四个价格。","开盘价、收盘价、最高价、最低价。","中间粗的叫「实体」，在开盘价和收盘价之间。","上下细线叫「影线」，顶端是最高价，底端是最低价。","A 股习惯：收盘高于开盘是红色阳线；收盘低于开盘是绿色阴线。"],"qs":[{"q":"K 线上影线的最顶端代表？","o":["开盘价","最高价","收盘价"],"a":1,"e":"上影线顶端是这段时间的最高价。"},{"q":"在 A 股，收盘价高于开盘价，K 线通常是？","o":["红色","绿色"],"a":0,"e":"A 股习惯红涨绿跌，这叫阳线。"}]},{"id":"g8-5","icon":"🥧","title":"分散投资和资产配置","tip":"没有标准答案，比例要看目标和能承受的风险。","pts":["分散投资：买不同公司、不同行业。","资产配置：把钱分到不同大类，比如存款、债券、股票。","不同大类涨跌节奏不一样，可以互相缓冲。","比例看目标、时间长短和能承受多少亏损。","定期检查，偏离太多时调回来，叫「再平衡」。"],"qs":[{"q":"买了 5 家公司，全是电动车公司，算充分分散吗？","o":["算","不算，都在同一个行业"],"a":1,"e":"同一行业常常一起涨跌，分散效果有限。"},{"q":"资产配置是指？","o":["只买一只最好的股票","把钱分到存款、债券、股票等不同类别"],"a":1,"e":"资产配置是在大类之间分配。"}]},{"id":"g8-6","icon":"😱","title":"情绪和追涨杀跌","tip":"先写计划，再行动；冷静 24 小时。","pts":["追涨：看到涨了很多，怕错过，冲进去买，常常买在高处。","杀跌：看到跌了，害怕，赶紧卖，常常卖在低处。","怕错过、跟着别人走，是人人都有的心理。","办法：提前写好计划，为什么买、什么情况卖。","不因一条消息冲动，不懂的不买。"],"qs":[{"q":"同学说某股票连涨 5 天，快买！你应该？","o":["马上全买","先了解公司、冷静想想、和家长讨论"],"a":1,"e":"连涨不代表还会涨，冲动最容易出错。"},{"q":"「杀跌」是指？","o":["下跌时恐慌卖出","下跌时买入"],"a":0,"e":"杀跌是被下跌吓到而卖出。"}]},{"id":"g8-7","icon":"🌏","title":"A 股、港股、美股","tip":"交易所、货币和规则都不一样。","pts":["A 股：在上海、深圳、北京的证券交易所交易，用人民币。","港股：在香港交易所交易，用港元。","美股：主要在纽约证券交易所和纳斯达克交易，用美元。","不少中国公司在港股或美股上市。","三个市场的交易时间和规则都不一样。"],"qs":[{"q":"港股用什么货币交易？","o":["人民币","港元","美元"],"a":1,"e":"港股以港元交易。"},{"q":"美股主要在哪些交易所？","o":["纽约证券交易所和纳斯达克","上海证券交易所","香港交易所"],"a":0,"e":"这两家是美国最主要的股票交易所。"}]},{"id":"g8-8","icon":"📏","title":"T+1、T+0 和涨跌停","tip":"规则会调整，以交易所最新规定为准。","pts":["T+1：A 股今天买的股票，最早下一个交易日才能卖。","T+0：当天买的当天就能卖，港股、美股是这样。","涨跌停：A 股每只股票每天涨跌有上限，碰到上限叫涨停或跌停。","不同板块幅度不同：主板一般 10%，创业板和科创板一般 20%。","港股、美股没有 A 股这样的每日涨跌停，但有别的保护机制，比如美股的「熔断」。","A 股一般以 100 股为 1 手来买。"],"qs":[{"q":"A 股今天买入的股票，最早什么时候能卖？","o":["当天","下一个交易日"],"a":1,"e":"A 股实行 T+1。"},{"q":"哪个市场没有 A 股这样的每日涨跌停？","o":["A 股主板","港股","都有"],"a":1,"e":"港股没有每日涨跌停限制。"}]}]},"WORDS":[["股票","公司的一小份，买了就成为股东。","g4"],["股东","拥有公司股票的人，公司的小小主人。","g4"],["公司","一群人一起做生意、赚钱的组织。","g4"],["涨 / 跌","价格变高叫涨，变低叫跌。","g4"],["供求关系","想买的人和想卖的人谁多，决定价格往哪走。","g4"],["利息","钱存银行，银行额外给你的钱。","g4"],["风险","结果可能和你想的不一样，可能亏钱。","g4"],["分散","不把钱都放在一个地方。","g4"],["证券账户","买卖股票用的账户，要大人去证券公司开。","g5"],["涨跌幅","价格变化占昨天价格的百分比。","g5"],["百分比","每 100 份里有几份，用 % 表示。","g5"],["分红","公司把赚的一部分钱分给股东。","g5"],["指数","用一篮子股票看市场整体表现的数字。","g5"],["基金","很多人把钱交给专业的人一起投资。","g5"],["复利","利滚利，赚到的钱继续赚钱。","g5"],["本金","一开始投进去的钱。","g5"],["市值","股 var CUP=1,MNAMES=["小雨","阿杰","朵朵","大熊","乐乐","米粒","豆豆","安安"];
function mById(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i]}
function ordPrice(o){return mById(MB,o.b).p+o.t.reduce(function(s,t){return s+mById(MT,t).p},0)}
function ordCost(o){return CUP+mById(MB,o.b).c+o.t.reduce(function(s,t){return s+mById(MT,t).c},0)}
function ordName(o){return mById(MB,o.b).ico+mById(MB,o.b).name+(o.t.length?" + "+o.t.map(function(t){return mById(MT,t).ico+mById(MT,t).name}).join(" + "):"")}
function newMini(p){var g=p.grade,n=g==="g4"?4:g==="g5"?5:6,orders=[];
  for(var i=0;i<n;i++){var k=g==="g4"?1:g==="g5"?1+(i%2):2+(i%2),pool=MT.map(function(t){return t.id}),t=[];while(t.length<k){var x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];t.push(x)}t.sort(function(a,b){return MT.indexOf(mById(MT,a))-MT.indexOf(mById(MT,b))});orders.push({b:MB[Math.floor(Math.random()*MB.length)].id,t:t,who:MNAMES[(i+p.shop.days)%MNAMES.length]})}
  return{day:p.shop.days,i:0,orders:orders,pb:null,pt:[],rev:0,cost:0,good:0,bad:0,log:[],q:null,done:false}}
function miniServe(p){var m=p.mini,o=m.orders[m.i],mine={b:m.pb,t:m.pt.slice().sort(function(a,b){return MT.indexOf(mById(MT,a))-MT.indexOf(mById(MT,b))})};
  if(!m.pb)return;var c=ordCost(mine);m.cost+=c;
  if(mine.b===o.b&&mine.t.join()===o.t.join()){var pr=ordPrice(o);m.rev+=pr;m.good++;m.log.push({ok:true,txt:o.who+"：收入 "+pr+" 元 − 成本 "+c+" 元 = 利润 "+(pr-c)+" 元，毛利率 "+Math.round((pr-c)/pr*100)+"%"});m.i++;snd("coin")}
  else{m.bad++;m.log.push({ok:false,txt:o.who+"：做错啦！这杯的成本 "+c+" 元白花了，重做一杯。"});snd("no")}
  m.pb=null;m.pt=[];if(m.i>=m.orders.length){m.done=true;var f=fx(p);f.mini.plays++;if(!m.bad)f.mini.perfect++}}
function miniQ(p){var m=p.mini,g=p.grade,pr=m.rev-m.cost;
  if(g==="g4")return{q:"今天小游戏一共收入 "+m.rev+" 元，成本 "+m.cost+" 元。利润是多少？",o:[(pr)+" 元",(m.rev+m.cost)+" 元",m.rev+" 元"],a:0,e:"利润 = 收入 − 成本 = "+m.rev+" − "+m.cost+" = "+pr+" 元。"};
  if(g==="g5"){var best=MB.slice().sort(function(a,b){return(b.p-b.c)-(a.p-a.c)})[0];return{q:"不加配料的话，哪种奶茶每杯赚得最多（售价 − 原料成本）？",o:MB.map(function(b){return b.name+"（卖 "+b.p+" 元，原料 "+b.c+" 元）"}),a:MB.indexOf(best),e:best.name+"：每杯赚 "+best.p+" − "+best.c+" = "+(best.p-best.c)+" 元，最多。卖得贵不一定赚得多，要减掉成本看。"}}
  var gm=m.rev?Math.round(pr/m.rev*100):0,wr=[gm,Math.min(99,gm+15),Math.max(1,gm-20)];return{q:"今天收入 "+m.rev+" 元，成本 "+m.cost+" 元。毛利率（利润 ÷ 收入）大约是多少？",o:wr.map(function(x){return x+"%"}),a:0,e:"毛利率 = （"+m.rev+" − "+m.cost+"）÷ "+m.rev+" ≈ "+gm+"%。毛利率越高，每卖 100 元留下的钱越多。看公司财报时也会看毛利率。"}}
function viewMini(p){var m=p.mini,h='<div class="card mini"><b>🎮 接单小游戏：照订单做奶茶</b> <span class="tiny">学：成本、收入、利润、毛利率</span>';
  if(!m.done){var o=m.orders[m.i];
    h+='<div class="small muted">第 '+(m.i+1)+' / '+m.orders.length+' 单 · 不限时，慢慢来</div><div class="order"><span class="cust">'+["🧒","👧","👦","👩","🧑","👵"][m.i%6]+'</span><div class="bub">'+esc(o.who)+'：我要 <b>'+ordName(o)+'</b>，卖 '+ordPrice(o)+' 元</div></div>';

    h+='<div class="small muted">② 加配料（可多选，再点一次取消）</div><div class="row">'+MT.map(function(t){return '<button class="chip'+(m.pt.indexOf(t.id)>=0?' on':'')+'" data-a="mt" data-v="'+t.id+'">'+t.ico+' '+t.name+' <span class="tiny">'+t.c+'元</span></button>'}).join('')+'</div>';
    h+='<div class="small">杯子 '+CUP+' 元。这杯成本：<b>'+(m.pb?ordCost({b:m.pb,t:m.pt}):'—')+' 元</b></div><div class="row">'+btn("做好了，递给客人 🧋","mserve","","pri",!m.pb)+'</div>';
  }else{var pr=m.rev-m.cost;h+='<div class="good" style="margin-top:8px">做完 '+m.orders.length+' 单！'+(m.bad?'做错 '+m.bad+' 杯。':'一杯都没做错 👍')+'<br>收入 <b>'+m.rev+'</b> 元 − 成本 <b>'+m.cost+'</b> 元 = 利润 <b>'+pr+'</b> 元'+(m.rev?'，毛利率约 <b>'+Math.round(pr/m.rev*100)+'%</b>':'')+'</div>';
    var q=miniQ(p),ans=m.q!=null;h+='<div class="q"><h3>🧠 '+esc(q.q)+'</h3><div class="row">'+q.o.map(function(o,k){return '<button class="opt'+(ans&&k===q.a?' right':ans&&k===m.q?' wrong':'')+'" data-a="mq" data-v="'+k+'"'+(ans?' disabled':'')+'>'+String.fromCharCode(65+k)+'. '+esc(o)+'</button>'}).join('')+'</div>'+(ans?'<div class="exp"><b class="'+(m.q===q.a?'ok':'no')+'">'+(m.q===q.a?'算对啦！':'再想想！')+'</b>'+esc(q.e)+'</div>':'')+'</div>';
    if(ans)h+='<div class="tip">⭐ 答对的好评变成<b>口碑</b>：今天营业会多来 '+Math.round((p.shop.buzz||0)*100)+'% 的客人。好口碑就像公司的「品牌」，也是一种价值。</div>';}
  if(m.log.length)h+='<div class="tiny" style="margin-top:8px">'+m.log.slice(-3).reverse().map(function(l){return(l.ok?'✅ ':'❌ ')+esc(l.txt)}).join('<br>')+'</div>';
  return h+'</div>'}

function openShop(p){
  var s=p.shop;if(s.avail<=0)return;
  var w=weatherOf(p),price=clampN(s.price,3,25),cups=Math.round(clampN(s.cups,10,200)),sweet=8+s.up.recipe;
  var pf=price<=sweet?1+(sweet-price)*0.03:Math.max(0,1-(price-sweet)/12),base=w.base*(1+0.1*s.up.sign);
  base*=1+(s.buzz||0);if(w.id==="hot")base*=1+0.15*s.up.ice;if(w.id==="rain")base*=1+0.25*s.up.shade;
  var demand=Math.round(base*pf),sold=Math.min(demand,cups),rev=Math.round(sold*price*100)/100,cost=cups*CUPCOST+RENT,profit=Math.round((rev-cost)*100)/100,coins=Math.max(0,Math.round(profit/10));
  var tips=[];
  if(demand>cups)tips.push("🎉 卖光啦！还有 "+(demand-cups)+" 位客人没买到，下次可以多准备一些。");
  if(cups-sold>=Math.max(5,cups*0.2))tips.push("🗑️ 剩了 "+(cups-sold)+" 杯倒掉了，白白花了 "+((cups-sold)*CUPCOST)+" 元成本。看天气决定准备多少杯！");
  if(price>sweet+4)tips.push("💸 价格有点高，不少客人嫌贵走掉了。");
  if(price<sweet-3)tips.push("🪙 价格很便宜，客人多，但每杯赚得少。");
  if(profit<0)tips.push("📉 今天亏钱了：成本比营收还多。当老板也会亏，想想哪里可以改。");
  if(s.buzz)tips.push("⭐ 接单小游戏的好口碑，让今天多来了约 "+Math.round(s.buzz*100)+"% 的客人。");s.buzz=0;
  if(!tips.length)tips.push("👍 价格和杯数都挺合适，继续保持！");
  s.days++;s.avail--;p.coins+=coins;p.earned+=coins;
  s.last={day:s.days,price:price,w:w.ico+w.name,demand:demand,sold:sold,cups:cups,rev:rev,cost:cost,profit:profit,coins:coins,tips:tips};
  s.hist.push({day:s.days,profit:profit});s.hist=s.hist.slice(-20);
}
function startLevel(p,id){p.run={id:id,step:0,m:null,q:[],alloc:{tea:0,rocket:0,book:0,farm:0},rev:false,res:null,ev:pickEv(p),fresh:!(p.lv[id]&&p.lv[id].stars)};if(LV[id].game)p.run.gm=GAMES[LV[id].game].init(p);DB.scr="level"}
function finishLevel(p){
  var r=p.run,L=LV[r.id],g=p.grade,qs=L.qs(g),c=0,total=1+qs.length;
  if(L.alloc){var a=r.alloc,tot=g==="g8"?20:10;if(Math.max(a.tea,a.rocket,a.book,a.farm)<=tot/2)c++}else if(L.game){if(r.gok)c++}else if(r.m===L.m(g).a)c++;
  qs.forEach(function(q,i){if(r.q[i]===q.a)c++});
  var pass=c/total>=0.6,stars=!pass?0:c===total?3:total-c===1?2:1,old=p.lv[r.id]||{stars:0,tries:0},res={pass:pass,correct:c,total:total,stars:stars,coins:0,badge:null,day:false};
  old.tries++;

    else if(stars>old.stars)res.coins=10*(stars-old.stars);
    old.stars=Math.max(old.stars,stars);p.coins+=res.coins;p.earned+=res.coins}
  p.lv[r.id]=old;r.res=res;r.step=3;
}
