<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>小小投资家 · 经营闯关版</title>
<style>
:root{--bg:#FFF6E0;--card:#fff;--ink:#24304A;--ink2:#4F5B76;--ink3:#7A849C;--line:#F0DDB8;--lineD:#E2C998;--accent:#3D8BFF;--accentD:#2361C4;--accentSoft:#E4EFFF;--go:#36C46F;--goD:#22914F;--gold:#FFC93C;--goldD:#D99A00;--red:#FF6B6B;--redD:#CC4747;--up:#E5383B;--down:#1F9D55;--okSoft:#E2F7EA;--badSoft:#FFE6E6;--warnSoft:#FFF1D2;--warn:#A86200;--purple:#8B6CFF;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px;scroll-padding-bottom:110px}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#BDE6FF 0,#E4F5FF 260px,#FFF6E0 620px,#FFF1D4 100%);background-color:#FFF1D4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:20px;line-height:1.55;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);overflow-wrap:anywhere;word-break:break-word;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.scr{padding:calc(10px + env(safe-area-inset-top)) 0 40px}.hud~.scr{padding-top:8px}.scr.wbar{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.scr.enter{animation:slideIn .28s ease-out}@keyframes slideIn{from{opacity:.2;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.2;margin:8px 0}
h2{font-size:26px;line-height:1.3;margin:26px 0 12px;font-weight:800}
h3{font-size:21px;line-height:1.4;margin:0 0 8px;font-weight:800}
p{margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;align-items:stretch}.row.c{justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
button{font-family:inherit;color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:48px;min-width:48px;cursor:pointer;font-size:19px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:0 6px 0 rgba(214,178,112,.28)}
button.card{display:block;width:100%;transition:transform .08s}button.card:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(214,178,112,.28)}
.card.on{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 6px 0 #B9D3FF}
.card.lock{background:#F4EFE6}
.btn{padding:12px 24px;font-size:20px;font-weight:800;border-radius:18px;border:3px solid var(--lineD);background:#fff;box-shadow:0 5px 0 var(--lineD);transition:transform .08s,box-shadow .08s;min-height:54px;line-height:1.25}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--lineD)}
.btn.pri{background:var(--accent);border-color:var(--accentD);color:#fff;box-shadow:0 5px 0 var(--accentD)}.btn.pri:active:not(:disabled){box-shadow:0 1px 0 var(--accentD)}
.btn.go{background:var(--go);border-color:var(--goD);color:#fff;box-shadow:0 6px 0 var(--goD);text-shadow:0 2px 0 rgba(0,0,0,.15)}.btn.go:active:not(:disabled){box-shadow:0 1px 0 var(--goD)}
.btn.gold{background:var(--gold);border-color:var(--goldD);color:#4A3200;box-shadow:0 5px 0 var(--goldD)}.btn.gold:active:not(:disabled){box-shadow:0 1px 0 var(--goldD)}
.btn.red{border-color:#F3B4B4;color:var(--redD);box-shadow:0 5px 0 #F3B4B4}
.btn.big{display:block;width:100%;max-width:460px;margin:18px auto;font-size:24px;min-height:66px;border-radius:24px}
.btn.huge{display:block;margin:18px auto 10px;font-size:32px;min-height:84px;padding:14px 56px;border-radius:32px;box-shadow:0 8px 0 var(--goD),0 14px 28px rgba(34,145,79,.35);position:relative}
.btn.huge:after{content:"";position:absolute;inset:-8px;border-radius:38px;border:5px solid rgba(54,196,111,.55);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.12,1.3);opacity:0}}
.btn.acct{min-height:56px;font-size:20px;width:100%;max-width:520px}.btn.acct.on{background:#E8F7EE;border-color:#9ED5B3;color:#1E6B3C}
.ptag{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:#FFF1D6;border:2px solid #F2C46D;color:#8A5A00;font-size:14px;font-weight:800;white-space:nowrap}
.card.pend{border-color:#F2C46D;background:#FFFBF2}
.chip{padding:8px 18px;font-size:19px;font-weight:700;border-radius:999px;border:3px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);min-height:52px}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip.on{border-color:var(--accent);background:var(--accentSoft);box-shadow:0 4px 0 #B9D3FF}
@media (hover:hover){.btn:not(:disabled):hover,.chip:not(:disabled):hover,.opt:not(:disabled):hover{filter:brightness(1.05)}}
.muted{color:var(--ink2)}.small{font-size:17px}.tiny{font-size:15px;color:var(--ink3)}
.up{color:var(--up)}.down{color:var(--down)}.ok{color:var(--down)}.no{color:var(--up)}
.tag{display:inline-block;background:#FFE9E9;color:#B42318;border:2px solid #F5C2C2;border-radius:10px;padding:0 8px;font-size:13px;font-weight:800;white-space:nowrap;vertical-align:middle}
.tag2{display:inline-block;background:var(--accentSoft);color:var(--accentD);border-radius:10px;padding:0 8px;font-size:14px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:800;font-size:18px;min-height:44px}
.pill.sm{min-height:0;padding:0 10px;font-size:15px;border-width:2px}
/* ---- 顶部 HUD ---- */
.hud{position:sticky;top:0;z-index:20;margin:0 -18px;padding:calc(8px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:0 0 24px 24px;box-shadow:0 4px 0 rgba(150,190,230,.35)}
.hav{width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#FFE29A,#FFC24D);box-shadow:0 4px 0 var(--goldD);font-size:30px;padding:0;flex:0 0 auto}
.hname{flex:1;min-width:0;line-height:1.2}.hname b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hname span{font-size:14px;color:var(--ink3);font-weight:700}
.stats{display:flex;gap:8px;align-items:center;margin-left:auto}
.st{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px 0 6px;border-radius:999px;background:#FFF8E6;border:3px solid #FFE0A3;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.st i{font-style:normal;font-size:24px;line-height:1}.st.s{background:#FFF9DB;border-color:#FFE58A}.st.b{background:#F3EEFF;border-color:#DCD0FF}
.st.m{padding:0;width:48px;justify-content:center;background:#fff;border-color:var(--line);font-size:22px}
.coin{display:inline-block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#E0A100);border:2px solid #C98A00;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);position:relative}.coin:after{content:"★";position:absolute;inset:0;text-align:center;line-height:24px;font-size:14px;color:#B07800}
.bump{animation:bump .5s ease-out}@keyframes bump{40%{transform:scale(1.35)}}
.flyc{position:fixed;z-index:70;font-size:30px;line-height:1;pointer-events:none;left:0;top:0;transition:transform .85s cubic-bezier(.45,-0.35,.6,1),opacity .85s}
.spark{position:fixed;z-index:70;pointer-events:none;font-size:22px;animation:spark .7s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
/* ---- 底部图标栏 ---- */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:min(700px,calc(100% - 16px));display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:6px;background:#fff;border-radius:26px;border:3px solid #E7F1FF;box-shadow:0 6px 0 rgba(120,160,210,.35),0 10px 26px rgba(40,70,120,.18)}
.tabbar button{position:relative;border:0;background:transparent;border-radius:18px;min-height:60px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-size:15px;color:var(--ink2);line-height:1.15}
.tabbar i{font-style:normal;font-size:27px;line-height:32px;transition:transform .15s}
.tabbar button.on{background:#FFF1C9;color:var(--ink)}.tabbar button.on i{transform:translateY(-3px) scale(1.12)}
.tabbar .dot{position:absolute;top:4px;right:calc(50% - 24px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:13px;line-height:20px;padding:0 5px;font-weight:900}
/* ---- 喵掌柜 ---- */
.say{display:flex;gap:10px;align-items:flex-end;margin:12px 0}.say .cat{flex:0 0 auto;animation:bob 2.6s ease-in-out infinite}
.bub{position:relative;flex:1;min-width:0;background:#fff;border:3px solid #FFDCA8;border-radius:24px 24px 24px 8px;padding:12px 18px;font-size:21px;line-height:1.5;box-shadow:0 5px 0 rgba(255,190,100,.3);animation:bubIn .3s ease-out}
.bub.old{animation:none;opacity:.75;font-size:19px}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-5px)}}
.talk{margin:6px 0}.talk .say{margin:8px 0}.talk .say+.say .cat{visibility:hidden}
.exp{position:relative;margin-top:12px;font-size:19px;line-height:1.55;color:var(--ink);background:#FFF9EC url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 aria-hidden=%22true%22%3E%3Cpath d=%22M16 44L20 8L46 28Z%22 fill=%22%23FFA94D%22 stroke=%22%23E07B1F%22 stroke-width=%223.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M84 44L80 8L54 28Z%22 fill=%22%23FFA94D%22 stroke=%22%23E07B1F%22 stroke-width=%223.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M23 36L25 18L38 29Z%22 fill=%22%23FFC2C2%22/%3E%3Cpath d=%22M77 36L75 18L62 29Z%22 fill=%22%23FFC2C2%22/%3E%3Cellipse cx=%2250%22 cy=%2258%22 rx=%2239%22 ry=%2233%22 fill=%22%23FFB866%22 stroke=%22%23E07B1F%22 stroke-width=%223.5%22/%3E%3Cpath d=%22M42 27q8 7 16 0M46 34q4 3 8 0%22 stroke=%22%23E8892E%22 stroke-width=%223.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Cellipse cx=%2250%22 cy=%2270%22 rx=%2217%22 ry=%2212%22 fill=%22%23FFE3BF%22/%3E%3Cpath d=%22M32 52q6-7 12 0M56 52q6-7 12 0%22 stroke=%22%233A2A1E%22 stroke-width=%224.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M45.5 60h9l-4.5 4.5z%22 fill=%22%23F0626B%22/%3E%3Cpath d=%22M43 64q3.5 5 7 0q3.5 5 7 0%22 stroke=%22%233A2A1E%22 stroke-width=%223.5%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2225%22 cy=%2265%22 r=%226%22 fill=%22%23FF8A8A%22 opacity=%22.55%22/%3E%3Ccircle cx=%2275%22 cy=%2265%22 r=%226%22 fill=%22%23FF8A8A%22 opacity=%22.55%22/%3E%3Cpath d=%22M8 60l14 2M8 70l14-2M92 60l-14 2M92 70l-14-2%22 stroke=%22%23C9701C%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M36 92l14-6 14 6-14 6z%22 fill=%22%23E5484D%22 stroke=%22%23B8323A%22 stroke-width=%222%22/%3E%3Ccircle cx=%2250%22 cy=%2292%22 r=%223.5%22 fill=%22%23FFD24D%22/%3E%3C/svg%3E") 10px 10px/46px 46px no-repeat;border:3px solid #FFE1B0;border-radius:20px;padding:12px 16px 12px 66px;min-height:72px;animation:bubIn .3s ease-out}
.exp b{display:block;font-size:21px}
/* ---- 首页启动画面 ---- */
.toprow{display:flex;justify-content:flex-end;padding-top:4px}.toprow .acct{min-height:48px;font-size:16px;background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer}.toprow .acct.on{background:#E8F7EE;border-color:#9ED5B3;color:#1E6B3C}
.splash{text-align:center;padding:8px 0 6px;min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:center;align-items:center}.splash>*{max-width:100%}
@media (min-width:760px) and (min-height:900px){.logo svg{width:150px;height:150px}.title{font-size:68px}.hero .cat svg{width:170px;height:170px}.hero .bub{font-size:24px}.btn.huge{font-size:38px;padding:20px 66px}}
.logo{display:flex;flex-direction:column;align-items:center}.logo svg{width:110px;height:110px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08));animation:bob 3s ease-in-out infinite}
.title{font-size:54px;line-height:1.1;font-weight:900;letter-spacing:2px;margin:4px 0 0;color:#FF8A1F;text-shadow:0 3px 0 #fff,0 -3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 8px 0 rgba(200,110,20,.35)}
.sub{display:inline-block;margin-top:8px;background:var(--purple);color:#fff;font-weight:900;font-size:20px;padding:4px 18px;border-radius:999px;box-shadow:0 4px 0 #6447D6}
.hero{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px auto 0;max-width:560px}.hero .bub{flex:0 1 auto;text-align:left;border-radius:24px 24px 24px 8px}
.who{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:10px 0 6px}
.pf{width:118px;min-height:116px;border-radius:24px;border:3px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-weight:800;font-size:17px}
.pf .pa{font-size:46px;line-height:56px}.pf .pn{max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pf.on{border-color:var(--go);box-shadow:0 5px 0 var(--goD)}.pf.add .pa{color:var(--accent);font-weight:900}
.pf:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}.pf .ptag{font-size:12px;padding:0 6px}.pf .tiny{white-space:nowrap;font-size:13px}
.whotitle{font-weight:900;color:var(--ink2);font-size:18px;margin-top:8px}
/* ---- 建档 ---- */
.stepc{position:relative;margin:14px 0;padding-left:70px}.stepc .sn{position:absolute;left:16px;top:14px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#4A3200;font-weight:900;font-size:22px;text-align:center;line-height:40px;box-shadow:0 3px 0 var(--goldD)}
.stepc>b{display:block;font-size:22px;margin:4px 0 10px}
.avs{display:flex;flex-wrap:wrap;gap:10px}.avs .chip{font-size:30px;width:64px;height:64px;padding:0;border-radius:50%}
.grs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grs button{padding:10px 6px;text-align:center;border-radius:20px}.grs .gi{font-size:40px;line-height:48px;display:block}.grs b{display:block;font-size:20px}
/* ---- 设置 ---- */
.setlist{display:grid;gap:12px;max-width:560px}.sitem{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 18px;border-radius:20px;border:3px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);font-size:28px;min-height:68px}.sitem span{flex:1;font-size:20px;font-weight:800}.sitem b{font-size:17px;color:var(--ink3)}
/* ---- 闯关地图 ---- */
.maptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0}.maptop .bar{flex:1;min-width:160px;margin:0}
.map{position:relative;max-width:560px;margin:0 auto;overflow:hidden}
.map svg.path{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-44px);display:flex;flex-direction:column;align-items:center;width:150px}
.nd{width:88px;height:88px;border-radius:50%;padding:0;font-size:40px;line-height:1;border:5px solid #fff;color:#fff;background:linear-gradient(160deg,#7FB6FF,#3D8BFF);box-shadow:0 7px 0 var(--accentD),0 12px 20px rgba(35,97,196,.25);transition:transform .08s}
.nd:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--accentD)}
.nd.done{background:linear-gradient(160deg,#FFE07A,#FFB627);box-shadow:0 7px 0 var(--goldD),0 12px 20px rgba(217,154,0,.25)}
.nd.cur{background:linear-gradient(160deg,#7BE3A0,#36C46F);box-shadow:0 7px 0 var(--goD),0 0 0 8px rgba(54,196,111,.25);position:relative}.nd.cur:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:5px solid rgba(54,196,111,.6);animation:ring 1.4s ease-out infinite;pointer-events:none}
.nd.lock{background:linear-gradient(160deg,#E7EAF0,#C9CFDA);box-shadow:0 7px 0 #A9B1C0;opacity:1;color:#7A849C}
.nd.shop{background:linear-gradient(160deg,#FFB4A2,#FF7A59);box-shadow:0 7px 0 #D9573A}.nd.sim{background:linear-gradient(160deg,#C4B2FF,#8B6CFF);box-shadow:0 7px 0 #6447D6}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.nst{font-size:18px;letter-spacing:1px;color:#FFB300;text-shadow:0 2px 0 #fff;line-height:1;margin-top:6px;height:18px}.nst .e{color:#D5D9E2}
.nl{margin-top:4px;background:#fff;border-radius:14px;padding:2px 10px;font-size:15px;font-weight:800;line-height:1.3;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.06);max-width:150px}.nl .tiny{display:block;font-size:13px}
.node .me{position:absolute;top:-40px;font-size:34px;animation:hop 1.1s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.deco{position:absolute;font-size:34px;opacity:.85;transform:translate(-50%,-50%);pointer-events:none}
details.wod{margin:10px 0}details summary{cursor:pointer;min-height:44px;list-style:none;display:flex;align-items:center;gap:8px;font-weight:800}details summary::-webkit-details-marker{display:none}
details.more{text-align:center}details.more>summary{justify-content:center;color:var(--ink2);font-size:18px}
.tipbox{background:#FFF8D9;border:3px solid #FFE58A;border-radius:18px;padding:4px 16px}.tipbox[open]{padding-bottom:12px}
/* ---- 关卡 ---- */
.lvhead{display:flex;align-items:center;gap:10px;margin:4px 0 8px}.lvt{flex:1;min-width:0;text-align:center;line-height:1.25}.lvt b{display:block;font-size:23px}.lvt .tiny{font-weight:800}
.ibtn{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:#fff;box-shadow:0 4px 0 var(--line);font-size:22px;padding:0;font-weight:900}
.stepdots{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}.stepdots i{white-space:nowrap;font-style:normal;display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:999px;background:#fff;border:3px solid var(--line);font-size:16px;font-weight:800;color:var(--ink3)}
.stepdots i.on{background:var(--gold);border-color:var(--goldD);color:#4A3200;transform:scale(1.08)}.stepdots i.done{background:var(--okSoft);border-color:#9ED5B3;color:#1E6B3C}
.concept{text-align:center;margin:14px 0}.concept span{display:inline-block;background:linear-gradient(#FFF4C2,#FFE38A);border:3px solid #FFD24D;border-radius:18px;padding:8px 20px;font-size:21px;font-weight:800}
.qprog{display:flex;justify-content:center;gap:10px;margin:8px 0}.qprog i{font-style:normal;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid var(--line);font-weight:900;display:flex;align-items:center;justify-content:center}.qprog i.cur{border-color:var(--accent);background:var(--accentSoft)}.qprog i.ok{background:var(--go);border-color:var(--goD);color:#fff}.qprog i.no{background:var(--red);border-color:var(--redD);color:#fff}

.scene.rain{background:linear-gradient(#9EAEC4,#DCE3EE 62%,#8DB872 62%,#6FA257)}.scene.hot{background:linear-gradient(#FFC36B,#FFE9BD 62%,#A9D66E 62%,#86BF4E)}

.mini{margin:12px 0;border-color:#FFD58A;background:#FFFCF0}.order{display:flex;gap:10px;align-items:center;margin:8px 0}.order .cust{font-size:46px}.order .bub{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-size:19px}

/* ==== v2.5 科技感 · 霓虹多彩主题（覆盖上面的配色，不改尺寸） ==== */
:root{--neoC:#00E5FF;--neoP:#FF4FD8;--neoV:#A66BFF;--neoG:#3DFFA2;--neoY:#FFD23F;--neoO:#FF9A3C;--sky:#4FC3FF;--mint:#3DFFA2;--peach:#FF8FB1;--glass:rgba(255,255,255,.92);--glassB:rgba(255,255,255,.55);--darkG:rgba(14,20,64,.78);--lt:#EEF4FF;--lt2:#B9C8F5;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;--accent:#1F7AE0;--accentD:#1559A8;--accentSoft:#E3F4FF}
html{background:#0B1240}
body{color:var(--lt);background-color:#0B1240;background-image:
 radial-gradient(circle at 12% 18%,rgba(255,255,255,.9) 0 1.2px,transparent 1.6px),
 radial-gradient(circle at 78% 9%,rgba(255,255,255,.8) 0 1px,transparent 1.5px),
 radial-gradient(circle at 63% 41%,rgba(180,240,255,.8) 0 1.3px,transparent 1.7px),
 radial-gradient(circle at 30% 72%,rgba(255,220,255,.8) 0 1px,transparent 1.5px),
 radial-gradient(circle at 90% 80%,rgba(255,255,255,.7) 0 1.2px,transparent 1.6px),
 linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),
 linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px),
 radial-gradient(ellipse at 15% 0%,rgba(0,229,255,.28),transparent 55%),
 radial-gradient(ellipse at 95% 30%,rgba(255,79,216,.22),transparent 50%),
 radial-gradient(ellipse at 40% 100%,rgba(61,255,162,.16),transparent 55%),
 linear-gradient(165deg,#0E1A5C 0%,#2A1470 45%,#14306E 100%);
 background-size:260px 260px,330px 330px,290px 290px,370px 370px,410px 410px,44px 44px,44px 44px,100% 100%,100% 100%,100% 100%,100% 100%;background-attachment:fixed}
/* 直接写在星空背景上的字：浅色 */
.scr>h1,.scr>h2,.scr>h3,.scr>p,.scr>.tiny,.scr>.muted,.scr>.small,.scr>ul,.scr>ol,.whotitle,.scrtitle,.lvt,.lvt .tiny,.row>.tiny,.row>.muted,.maptop>.tiny,.splash>.tiny{color:var(--lt)}

function openShop(p){
  var s=p.shop;if(s.avail<=0)return;
  var w=weatherOf(p),price=clampN(s.price,3,25),cups=Math.round(clampN(s.cups,10,200)),sweet=8+s.up.recipe;
  var pf=price<=sweet?1+(sweet-price)*0.03:Math.max(0,1-(price-sweet)/12),base=w.base*(1+0.1*s.up.sign);
  base*=1+(s.buzz||0);if(w.id==="hot")base*=1+0.15*s.up.ice;if(w.id==="rain")base*=1+0.25*s.up.shade;
  var demand=Math.round(base*pf),sold=Math.min(demand,cups),rev=Math.round(sold*price*100)/100,cost=cups*CUPCOST+RENT,profit=Math.round((rev-cost)*100)/100,coins=Math.max(0,Math.round(profit/10));
  var tips=[];
  if(demand>cups)tips.push("🎉 卖光啦！还有 "+(demand-cups)+" 位客人没买到，下次可以多准备一些。");
  if(cups-sold>=Math.max(5,cups*0.2))tips.push("🗑️ 剩了 "+(cups-sold)+" 杯倒掉了，白白花了 "+((cups-sold)*CUPCOST)+" 元成本。看天气决定准备多少杯！");
  if(price>sweet+4)tips.push("💸 价格有点高，不少客人嫌贵走掉了。");
  if(price<sweet-3)tips.push("🪙 价格很便宜，客人多，但每杯赚得少。");
  if(profit<0)tips.push("📉 今天亏钱了：成本比营收还多。当老板也会亏，想想哪里可以改。");
  if(s.buzz)tips.push("⭐ 接单小游戏的好口碑，让今天多来了约 "+Math.round(s.buzz*100)+"% 的客人。");s.buzz=0;
  if(!tips.length)tips.push("👍 价格和杯数都挺合适，继续保持！");
  s.days++;s.avail--;p.coins+=coins;p.earned+=coins;
  s.last={day:s.days,price:price,w:w.ico+w.name,demand:demand,sold:sold,cups:cups,rev:rev,cost:cost,profit:profit,coins:coins,tips:tips};
  s.hist.push({day:s.days,profit:profit});s.hist=s.hist.slice(-20);
}
function startLevel(p,id){p.run={id:id,step:0,m:null,q:[],alloc:{tea:0,rocket:0,book:0,farm:0},rev:false,res:null,say:0,ev:pickEv(p),fresh:!(p.lv[id]&&p.lv[id].stars)};if(LV[id].game)p.run.gm=GAMES[LV[id].game].init(p);DB.scr="level"}
function finishLevel(p){
  var r=p.run,L=LV[r.id],g=p.grade,qs=L.qs(g),c=0,total=1+qs.length;
  if(L.alloc){var a=r.alloc,tot=g==="g8"?20:10;if(Math.max(a.tea,a.rocket,a.book,a.farm)<=tot/2)c++}else if(L.game){if(r.gok)c++}else if(r.m===L.m(g).a)c++;
  qs.forEach(function(q,i){if(r.q[i]===q.a)c++});
  var pass=c/total>=0.6,stars=!pass?0:c===total?3:total-c===1?2:1,old=p.lv[r.id]||{stars:0,tries:0},res={pass:pass,correct:c,total:total,stars:stars,coins:0,badge:null,day:false};
  old.tries++;
  if(pass){if(!old.stars){waitTick(p,res,r.id);res.coins=20+10*stars;if(p.badges.indexOf(L.badge)<0){p.badges.push(L.badge);res.badge=L.badge}if(p.shop.avail<3){p.shop.avail++;res.day=true}}
    else if(stars>old.stars)res.coins=10*(stars-old.stars);
    old.stars=Math.max(old.stars,stars);p.coins+=res.coins;p.earned+=res.coins}
  p.lv[r.id]=old;r.res=res;r.step=3;
}
/* ---------- 渲染 ---------- */
function render(){
  var p=P(),c='',h='',NOP={home:1,parent:1,acct:1,"new":1,set:1};
  if(DB.scr==="acct"&&!cloudOn())DB.scr="home";
  if(!p&&!NOP[DB.scr])DB.scr="home";
  if(DB.scr==="level"&&(!p||!p.run))DB.scr="map";
  if(DB.scr==="sim"&&p&&!simOpen(p))DB.scr="map";
  var s=DB.scr;
  if(s==="home"){h='<main class="scr wbar">'+viewHome()+disc()+'</main>'+homeBar()}
  else if(s==="acct"||s==="new"||s==="set"||(!p&&s==="parent")){c=s==="acct"?viewAcct():s==="new"?viewNew():s==="set"?viewSet():'<div class="row">'+btn("⬅ 回首页","go","home")+'</div>'+viewParent();h='<main class="scr">'+c+disc()+'</main>'}
  else{c=s==="map"?viewMap(p):s==="shop"?viewShop(p):s==="level"?viewLevel(p):s==="book"?viewBook(p):s==="rank"?viewRank():s==="parent"?viewParent():s==="sim"?viewSim(p):s==="ach"?viewAch(p):viewMap(p);
    h=hud(p)+gameBar(p)+'<main class="scr wbar">'+c+disc()+'</main>'}
  document.getElementById("app").innerHTML=h;
}
function go(scr){DB.scr=scr;DB.msg="";window.scrollTo(0,0)}
document.addEventListener("click",function(e){
  if(e.clientX||e.clientY)LASTXY=[e.clientX,e.clientY];var b=e.target.closest?e.target.closest("button[data-a]"):null;if(!b||b.disabled)return;
  var a=b.getAttribute("data-a"),v=b.getAttribute("data-v"),p=P(),top=false;
  if(a==="go"){if(v==="home"){DB.cur=null}if(!P()&&{book:1,rank:1,ach:1,map:1,shop:1,sim:1}[v]){var lp=lastP();if(lp)DB.cur=lp.id;else v="new"}if(v==="book"){DB.back=null;DB.bt=null;DB.bch=null}if(v!=="parent")DB.gate=false;go(v)}
  else if(a==="start"){var sp=lastP();if(sp){DB.cur=sp.id;DB.last=sp.id;go(sp.shop.days===0?"shop":"map")}else go("new")}
  else if(a==="say"){if(p&&p.run)p.run.say=(p.run.say||0)+1}
  else if(a==="sayall"){if(p&&p.run)p.run.say=99}
  else if(a==="pick"){DB.cur=v;DB.last=v;var q=P();go(q.shop.days===0?"shop":"map")}
  else if(a==="av"){DB.form.av=v}
  else if(a==="gr"){DB.form.grade=v}
  else if(a==="create"){var f=DB.form,nm=(f.name||"").trim();if(!nm){DB.msg="请先写上你的名字。"}else if(!f.grade){DB.msg="请选你的年级。"}else{var np=newProfile(nm.slice(0,10),f.av,f.grade);if(cLoggedIn()){np.pend=true;toast("📝 档案建好啦！可以先玩。等爸爸妈妈在「家长区」确认后，进度才会同步到云端。")}DB.profiles.push(np);DB.cur=np.id;DB.last=np.id;DB.form={name:"",av:"🐼",grade:""};go("shop")}}
  else if(a==="step"){var s=v.split("|"),k=s[0];setK(k,clampN((Number(getK(k))||0)+Number(s[1]),Number(s[2]),Number(s[3])))}
  else if(a==="open"){var d0=p.shop.days;openShop(p);if(p.shop.days>d0){DB.justOpen=true;snd(p.shop.last.profit>0?"coin":"no")}top=true}
  else if(a==="mute"){DB.mute=!DB.mute;if(!DB.mute)snd("ok")}
  else if(a==="mstart"){if(p.shop.avail>0&&!(p.mini&&p.mini.day===p.shop.days))p.mini=newMini(p)}
  else if(a==="mb"){if(p.mini&&!p.mini.done)p.mini.pb=v}
  else if(a==="mt"){if(p.mini&&!p.mini.done){var ix=p.mini.pt.indexOf(v);if(ix>=0)p.mini.pt.splice(ix,1);else p.mini.pt.push(v)}}
  else if(a==="mserve"){if(p.mini&&!p.mini.done)miniServe(p)}
  else if(a==="mq"){var mm=p.mini;if(mm&&mm.done&&mm.q==null){mm.q=Number(v);var okq=mm.q===miniQ(p).a;if(okq)fx(p).mini.qOk++;knowAns(p,okq,true);p.shop.buzz=Math.min(0.15,0.02*mm.good+(okq?0.05:0))}}
  else if(a==="evans"){var r0=p.run,ev=r0&&r0.ev&&evById(r0.ev.id);if(ev&&r0.ev.pick==null){r0.ev.pick=Number(v);var oke=r0.ev.pick===ev.a,f0=fx(p);if(oke){f0.evOk++;if(!f0.evDone[ev.id]){f0.evDone[ev.id]=1;p.coins+=3;p.earned+=3;r0.ev.coin=true}}knowAns(p,oke,true)}}
  else if(a==="pcode"){DB.pcode=makeCode(DB.profiles);DB.pmsg="进度码已生成（"+DB.profiles.length+" 个档案）。"}
  else if(a==="pcopy"){DB.pmsg=copyText(DB.pcode||"")?"已复制。如果没复制上，请长按上面的文字全选复制。":"请长按上面的文字全选复制。"}
  else if(a==="pimport"){try{var lst=readCode(DB.pin);var ms=mergeIn(lst,"进度码");sigAll();DB.pmsg="导入完成："+(ms.length?ms.join("；"):"本机进度已经是最新的，没有变化。");DB.pin=""}catch(err){DB.pmsg=err.message}}
  else if(a==="cmode"){DB.cmode=v;CS.msg=""}
  else if(a==="pok"){var tp=DB.profiles.filter(function(x){return x.id===v})[0];if(tp&&tp.pend&&DB.gate){delete tp.pend;tp.upd=Date.now();DB.msg="已确认「"+tp.name+"」加入家庭，正在同步…";saveRaw();setTimeout(function(){cSync(true)},0)}}
  else if(a==="prej"){var tr=DB.profiles.filter(function(x){return x.id===v})[0];if(tr&&tr.pend&&DB.gate&&confirm("确定删除「"+tr.name+"」吗？这个档案没有上传过云端，删除后不能恢复。")){DB.profiles.splice(DB.profiles.indexOf(tr),1);if(DB.cur===v)DB.cur=null;DB.msg="已删除「"+tr.name+"」。"}}
  else if(a==="cin"||a==="cup"){var cid=((document.getElementById("cid")||{}).value||"").trim(),cpw=(document.getElementById("cpw")||{}).value,cpw2=(document.getElementById("cpw2")||{}).value;DB.cid=cid;if(!cid||!cpw||cpw.length<6){CS.msg=a==="cup"?"请填写家长邮箱和至少 6 位密码。":"请填写家长邮箱（或家庭号）和至少 6 位密码。"}else if(a==="cup"&&cid.indexOf("@")<0&&!/^[a-z0-9_-]{4,30}$/i.test(cid)){CS.msg="请填写正确的家长邮箱。"}else if(a==="cup"&&cpw!==cpw2){CS.msg="两次输入的密码不一样，请再输一遍。"}else{CS.busy=true;CS.msg="正在连接云端…";try{cLogin(cid,cpw,a==="cup").then(function(){CS.busy=false;CS.msg=(a==="cup"?"注册成功，已登录":"登录成功")+"，正在同步…";return cSync(true)}).catch(function(e){CS.busy=false;CS.msg="没成功："+e.message;render()})}catch(e){CS.busy=false;CS.msg=e.message}}}
  else if(a==="csync"){cSync(true)}
  else if(a==="cout"){if(confirm("确定退出家庭账号吗？本机的进度会留在这台设备上。")){cSetTok(null);CS.last=0;CS.msg="已退出家庭账号。本机进度还在。"}}
  else if(a==="up"){var lv=p.shop.up[v],cost=UPCOST[lv];if(lv<3&&p.coins>=cost){p.coins-=cost;p.shop.up[v]=lv+1;snd("up");toast("🔧 升级成功！花金币升级，是为了以后赚更多——这就是<b>投资</b>。")}}
  else if(a==="lv"){var i=levels(p).indexOf(v);if(i>=0&&unlocked(p,i)){startLevel(p,v);top=true}}
  else if(a==="nx"){p.run.step++;top=true}
  else if(a==="mans"){if(p.run.m==null){p.run.m=Number(v);knowAns(p,p.run.m===LV[p.run.id].m(p.grade).a,p.run.fresh)}}
  else if(a==="reveal"){p.run.rev=true}
  else if(a==="qans"){var qq=v.split("|");if(p.run.q[qq[0]]==null){p.run.q[qq[0]]=Number(qq[1]);knowAns(p,Number(qq[1])===LV[p.run.id].qs(p.grade)[qq[0]].a,p.run.fresh)}}
  else if(a==="finish"){finishLevel(p);if(p.run.res.pass){snd("win");setTimeout(confetti,50)}else snd("no");top=true}
  else if(a==="book"){if(DB.scr==="level")DB.back="level";var c=findCh(v);if(c){DB.bt=c.g;DB.bch=c.c.id}go("book")}
  else if(a==="back"){DB.back=null;go("level")}
  else if(a==="bt"){DB.bt=v;DB.bch=null}
  else if(a==="bch"){DB.bch=v;setTimeout(function(){var el=document.getElementById("lesson");if(el)el.scrollIntoView({behavior:"smooth"})},0)}
  else if(a==="bdone"){p.done[v]=true}
  else if(a==="bans"){var bb=v.split("|");if(p.ans[bb[0]]===undefined){p.ans[bb[0]]=Number(bb[1]);var cq=findCh(bb[0].replace(/-\d+$/,""));if(cq&&cq.c.qs[Number(bb[0].split("-").pop())])knowAns(p,cq.c.qs[Number(bb[0].split("-").pop())].a===Number(bb[1]),true)}}
  else if(a==="wl"){DB.wl=v}
  else if(a==="gate"){if(v==="156"){DB.gate=true;DB.msg=""}else DB.msg="再算一算哦～（这里是给家长看的）"}
  else if(a==="gateoff"){DB.gate=false;go("map")}
  else if(a==="reset"){var t=DB.profiles.filter(function(x){return x.id===v})[0];if(t&&confirm("确定重置「"+t.name+"」的全部进度吗？金币、徽章、小店都会清零。")){var fresh=newProfile(t.name,t.av,t.grade);fresh.id=t.id;fresh.rst=Date.now();if(t.pend)fresh.pend=true;if(cloudOn()&&cTok()&&!t.pend){DB.cdel=DB.cdel||[];DB.cdel.push(t.id)}DB.profiles[DB.profiles.indexOf(t)]=fresh}}
  else if(a==="del"){var t2=DB.profiles.filter(function(x){return x.id===v})[0];if(t2&&confirm("确定删除「"+t2.name+"」的档案吗？删除后不能恢复。")){if(cloudOn()&&cTok()&&!t2.pend){DB.cdel=DB.cdel||[];DB.cdel.push(v)}DB.profiles.splice(DB.profiles.indexOf(t2),1);if(DB.cur===v){DB.cur=null;DB.gate=false;DB.scr="home"}}}
  else if(a==="snext"){simNext(p.sim)}
  else if(a==="sreset"){if(confirm("确定重新开始吗？会回到 10000 元。"))p.sim=newSim()}
  else if(a==="ssel"){p.sim.sel=v}
  else if(a==="sqty"){p.sim.qty=v}
  else if(a==="sbuy"){simTrade(p.sim,true,false)}else if(a==="ssell"){simTrade(p.sim,false,false)}else if(a==="ssellall"){simTrade(p.sim,false,true)}
  if(a.indexOf("g_")===0&&p)gameAct(p,a,v);
  checkAch(P());save();render();flushFx();postRender();postFx(a,v);if(top)window.scrollTo(0,0);
});
document.addEventListener("input",function(e){var t=e.target;if(!t||!t.getAttribute)return;
  if(t.getAttribute("data-name")){DB.form.name=t.value;save();return}
  if(t.getAttribute("data-pin")){DB.pin=t.value;return}
  var k=t.getAttribute("data-k");if(k){var clean=t.value.replace(/[^0-9.]/g,"");if(clean!==t.value)t.value=clean;setK(k,clean);save()}});
document.addEventListener("change",function(e){var t=e.target;if(t&&t.getAttribute&&t.getAttribute("data-k")){var k=t.getAttribute("data-k");setK(k,clampN(t.value,Number(t.getAttribute("data-min")),Number(t.getAttribute("data-max"))));save();render();postFx()}});
